        <section>
        <div class="bg-white text-secondary px-4 py-4 text-center">
            <div class="py-3">
                <h1 class="display-5 fw-bold text-black">Travel Booking Form</h1>
                <div class="col-lg-6 mx-auto">
                    <p class="fs-5 mb-4">Fill the Form and Submit yout Travel Request</p>
                </div>
            </div>
    </section>
    
    <section class="bg-light">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-md-6">
                    <div class="card shadow-lg p-3 rounded-4">
                        <h3 class="text-center fw-bold mb-4">Booy Your Trip</h3>

                        <form class="row g-3">
                            <div class="col-md-6">
                                <label for="name" class="form-label">Full Name</label>
                                <input type="text" class="form-control" id="name" placeholder="Enter Your Name">
                            </div>
                            <div class="col-md-6">
                                <label for="inputEmail4" class="form-label">Email</label>
                                <input type="email" class="form-control" id="inputEmail4" placeholder="Enter Email">
                            </div>

                            <div class="col-md-6">
                                <label for="inputState" class="form-label">Select Destination</label>
                                <select id="inputState" class="form-select">
                                    <option selected>Agra</option>
                                    <option>Mumbai</option>
                                    <option>Delhi</option>
                                    <option>Goa</option>
                                    <option>Kerla</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label for="traveldate" class="form-label">Travel Date</label>
                                <input type="date" class="form-control" id="traveldate">
                            </div>

                            <div class="col-md-12">
                                <label for="noofpeople" class="form-label">Number of People</label>
                                <input type="text" class="form-control" id="noofpeople"
                                    placeholder="Enter No of People">
                            </div>

                            <div class="col-12">
                                <label for="message" class="form-label">Message</label>
                                <input type="text" class="form-control" id="message" placeholder="Enter Any Travel Requirment">
                            </div>


                            <div class="d-grid gap-2 col-md-12">
                                <button type="submit" class="btn btn-primary">Submit Booking Request</button>
                            </div>
                        </form>

                        
                    </div>
                </div>
            </div>
        </div>
    </section>
